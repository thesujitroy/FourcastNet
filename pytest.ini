# FourCastNet tests run on their own: FourCastNet and HelioFM-surya_1.1 both have a
# top-level `utils` package, so they cannot share one pytest session.
#   cd FourCastNet && python -m pytest
# ".." puts the repo root on the path for the Tucker maps in attention/.
[pytest]
pythonpath = . ..
testpaths = tests
filterwarnings =
    # raised by the upstream networks/afnonet.py import in the parity test
    ignore:Importing from timm.models.layers is deprecated:FutureWarning
